version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cabbook-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cabbook
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: cabbook-app
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Database=cabbook;Username=postgres;Password=postgres;Port=5432"
      Jwt__Secret: "your-super-secret-key-change-in-production"
      Jwt__Issuer: "cabbook"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./Backend:/app/Backend

volumes:
  postgres_data:
