<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Smart cab booking and roster management">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <title>CabBook</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <div id="app">
        <!-- Navigation - Hidden on auth pages -->
        <nav class="navbar" id="navbar" style="display:none;">
            <div class="navbar-brand">CabBook</div>
        </nav>

        <!-- Main Content -->
        <main id="main" class="main-content"></main>

        <!-- Bottom Navigation - Hidden on auth pages -->
        <nav class="bottom-nav" id="bottomNav" style="display:none;">
            <a href="#/" class="nav-item active" data-page="home">
                <span class="nav-icon">🏠</span>
                <span class="nav-label">Home</span>
            </a>
            <a href="#/bookings" class="nav-item" data-page="bookings">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Bookings</span>
            </a>
            <a href="#/admin" class="nav-item" id="adminNav" style="display:none;" data-page="admin">
                <span class="nav-icon">⚙️</span>
                <span class="nav-label">Admin</span>
            </a>
            <a href="#/logout" class="nav-item" data-page="logout">
                <span class="nav-icon">🚪</span>
                <span class="nav-label">Exit</span>
            </a>
        </nav>
    </div>

    <!-- AUTH PAGE -->
    <template id="auth-page">
        <div class="auth-wrapper">
            <!-- Login Tab -->
            <div class="auth-tab active" id="login-tab">
                <div class="auth-header">
                    <h1>CabBook</h1>
                    <p>Book your ride</p>
                </div>

                <form id="loginForm" class="auth-form">
                    <div class="form-field">
                        <label>Email</label>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required>
                    </div>

                    <button type="submit" class="btn-primary btn-large">Send OTP</button>

                    <div id="otpPrompt" class="otp-section" style="display:none;">
                        <div class="form-field">
                            <label>6-Digit OTP</label>
                            <input type="text" id="otp" placeholder="000000" maxlength="6" pattern="[0-9]" required>
                        </div>
                        <button type="button" class="btn-primary btn-large" id="verifyBtn">Verify & Login</button>
                    </div>

                    <div class="auth-divider">or</div>

                    <button type="button" class="btn-secondary btn-large" id="switchToSignup">Create Account</button>
                </form>
            </div>

            <!-- Signup Tab -->
            <div class="auth-tab" id="signup-tab">
                <div class="auth-header">
                    <h1>Join CabBook</h1>
                    <p>Get started in seconds</p>
                </div>

                <form id="signupForm" class="auth-form">
                    <div class="form-field">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="signupEmail" placeholder="your@email.com" required>
                    </div>

                    <div class="form-field">
                        <label>Full Name</label>
                        <input type="text" id="signupName" placeholder="John Doe">
                    </div>

                    <div class="form-field">
                        <label>Phone</label>
                        <input type="tel" id="signupPhone" placeholder="+1 (555) 000-0000">
                    </div>

                    <div class="form-field">
                        <label>Pickup Location <span class="required">*</span></label>
                        <input type="text" id="signupPickup" placeholder="Enter address" required>
                    </div>

                    <div class="form-field">
                        <label>Dropoff Location <span class="required">*</span></label>
                        <input type="text" id="signupDropoff" placeholder="Enter address" required>
                    </div>

                    <p class="form-hint">Admin will review and approve your account</p>

                    <button type="submit" class="btn-primary btn-large">Create Account</button>
                    <button type="button" class="btn-secondary btn-large" id="switchToLogin">Back to Login</button>
                </form>
            </div>
        </div>
    </template>

    <!-- HOME PAGE -->
    <template id="home-page">
        <div class="page-container">
            <div class="welcome-section">
                <h2 id="userName"></h2>
                <p class="subtitle">Welcome back</p>
            </div>

            <div class="quick-actions">
                <a href="#/bookings" class="action-card">
                    <div class="action-icon">📅</div>
                    <h3>New Booking</h3>
                    <p>Book a ride</p>
                </a>

                <a href="#/bookings" class="action-card">
                    <div class="action-icon">🔄</div>
                    <h3>My Bookings</h3>
                    <p>View history</p>
                </a>

                <a href="#/" class="action-card">
                    <div class="action-icon">ℹ️</div>
                    <h3>Support</h3>
                    <p>Get help</p>
                </a>
            </div>
        </div>
    </template>

    <!-- BOOKINGS PAGE -->
    <template id="bookings-page">
        <div class="page-container">
            <h2>My Bookings</h2>

            <div class="booking-form-card">
                <h3>New Booking</h3>
                <form id="bookingForm">
                    <div class="form-field">
                        <label>Select Shift</label>
                        <select id="shiftSelect" required></select>
                    </div>

                    <div class="form-field">
                        <label>Select Location</label>
                        <select id="locationSelect" required></select>
                    </div>

                    <div class="form-field">
                        <label>Date</label>
                        <input type="date" id="bookingDate" required>
                    </div>

                    <button type="submit" class="btn-primary btn-large">Book Ride</button>
                </form>
            </div>

            <h3 style="margin-top: 2rem;">Your Bookings</h3>
            <div id="bookingsContainer" class="bookings-list"></div>
        </div>
    </template>

    <!-- ADMIN PAGE -->
    <template id="admin-page">
        <div class="page-container">
            <h2>Admin Dashboard</h2>

            <div class="admin-tabs">
                <button class="tab-btn active" data-tab="pending">Pending</button>
                <button class="tab-btn" data-tab="shifts">Shifts</button>
                <button class="tab-btn" data-tab="locations">Locations</button>
                <button class="tab-btn" data-tab="rosters">Rosters</button>
            </div>

            <!-- Pending Users -->
            <div class="tab-pane active" id="pending">
                <div id="pendingContainer" class="pending-list"></div>
            </div>

            <!-- Shift Slots -->
            <div class="tab-pane" id="shifts">
                <form id="shiftForm" class="admin-form">
                    <div class="form-field">
                        <label>Shift Name</label>
                        <input type="text" id="shiftName" placeholder="Morning" required>
                    </div>
                    <div class="form-field">
                        <label>Start Time</label>
                        <input type="time" id="shiftStart" required>
                    </div>
                    <div class="form-field">
                        <label>End Time</label>
                        <input type="time" id="shiftEnd" required>
                    </div>
                    <div class="form-field">
                        <label>Freeze Time (optional)</label>
                        <input type="time" id="shiftFreeze">
                    </div>
                    <button type="submit" class="btn-primary btn-large">Add Shift</button>
                </form>
                <div id="shiftsContainer" class="items-list"></div>
            </div>

            <!-- Locations -->
            <div class="tab-pane" id="locations">
                <form id="locationForm" class="admin-form">
                    <div class="form-field">
                        <label>Location Name</label>
                        <input type="text" id="locName" placeholder="Office A" required>
                    </div>
                    <div class="form-field">
                        <label>Address</label>
                        <input type="text" id="locAddress" placeholder="123 Main St" required>
                    </div>
                    <button type="submit" class="btn-primary btn-large">Add Location</button>
                </form>
                <div id="locationsContainer" class="items-list"></div>
            </div>

            <!-- Rosters -->
            <div class="tab-pane" id="rosters">
                <div id="rostersContainer" class="items-list"></div>
            </div>
        </div>
    </template>

    <!-- Scripts -->
    <script src="/api.js"></script>
    <script src="/app.js"></script>
</body>
</html>
